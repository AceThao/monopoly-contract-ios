name: iOS build

on:
  push:
  pull_request:

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MonopolyContract.xcodeproj \
            -scheme MonopolyContract \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build
